# Board: Generic - BK7231N (Tuya QFN32)
# Definition: definitions/boards/generic-bk7231n-qfn32-tuya/manifest.yaml

esphome:
  name: smart-plug-zld-44eufr-w-yt
  friendly_name: smart plug ZLD-44EU(FR)-W-YT

bk72xx:
  board: generic-bk7231n-qfn32-tuya
  family: BK7231N

logger:

api:
  encryption:
    key: "JNXLn7ILh6wwnTVqQZFaym8RwlzpWVqkjj1343cIiCw="

ota:
  - platform: esphome
    password: !secret smart_plug_zld_44eufr_w_yt__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: smart plug Hotspot
    password: VVbhfr6FskRi
captive_portal:

substitutions:
  bl0937_voltage_divider: "750"
  bl0937_current_resistor: "0.0025 ohm"

# The main relay is connected to P26
switch:
  - platform: gpio
    name: Socket 3
    pin: P26
    id: socket1
    on_turn_on:
      then:
        light.turn_on: led1
    on_turn_off: 
      then:
        light.turn_off: led1
    icon: "mdi:power-socket-eu"

# The LED is directly controlled via the state of the relay with the switch above
light:
  - platform: binary
    name: Socket 1 LED
    id: led1
    output: light_output
    internal: true

# The button on the side of the socket is wired to P11
binary_sensor:
  - platform: gpio
    pin:
      number: P10
      mode:
        input: true
        pullup: false
      inverted: true
    name: Button
    on_click:
      min_length: 50ms
      then:
        switch.toggle: socket1

output:
  - id: light_output
    platform: gpio
    inverted: true
    pin: P8

# The pins were checked with a multimeter and the datasheet for the built in BL0937.
sensor:
  - platform: uptime
    name: Uptime
  - platform: internal_temperature
    name: "Internal Temperature"
  - platform: hlw8012
    model: BL0937
    cf_pin:
      number: P7
      inverted: true
    cf1_pin:
      number: P6
      inverted: true
    sel_pin:
      number: P24
      inverted: true
    current:
      name: BL0937 Current
    voltage:
      name: BL0937 Voltage
    power:
      name: BL0937 Power
    energy:
      name: BL0937 Energy
    voltage_divider: $bl0937_voltage_divider
    current_resistor: $bl0937_current_resistor
    update_interval: 10s