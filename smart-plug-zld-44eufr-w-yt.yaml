# Board: Generic - BK7231N (Tuya QFN32)
# Definition: definitions/boards/generic-bk7231n-qfn32-tuya/manifest.yaml

esphome:
  name: smart-plug-zld-44eufr-w-yt
  friendly_name: smart plug ZLD-44EU(FR)-W-YT
  min_version: 2026.7.0

bk72xx:
  board: generic-bk7231n-qfn32-tuya

bk72xx_ble:
  enable_on_boot: false

logger:
  level: INFO

# No API key is compiled in: Home Assistant generates one when the device is
# added and the plug stores it in flash until a factory reset.
api:
  encryption: {}
# The runtime API key can't be inherited at build time, so OTA keeps its own.
ota:
  - platform: esphome
    encryption:
      key: !secret smart_plug_zld_44eufr_w_yt__encryption_key

# No Wi-Fi credentials are compiled in. Without saved credentials (fresh flash
# or factory reset) the plug starts the open AP right away; pick the network in
# the captive portal. While the AP is up the portal also accepts unauthenticated
# firmware uploads.
wifi:
  ap:
    ssid: smart-plug-44
captive_portal:

substitutions:
  bl0937_voltage_divider: "750"
  bl0937_current_resistor: "0.0025 ohm"

output:
  - platform: gpio
    id: socket1_out
    pin: P6
  - platform: gpio
    id: socket2_out
    pin: P7
  - platform: gpio
    id: socket3_out
    pin: P24
  - platform: gpio
    id: socket4_out
    pin: P8
  - platform: gpio
    id: usb_out
    pin:
      number: P26
      inverted: true

# Relays are driven through outputs so power_off can cut them without
# persisting "off" as the restore state of the switches.
switch:
  - platform: output
    name: Socket 1
    output: socket1_out
    id: socket1
    restore_mode: RESTORE_DEFAULT_ON
    device_class: outlet
  - platform: output
    name: Socket 2
    output: socket2_out
    id: socket2
    restore_mode: RESTORE_DEFAULT_ON
    device_class: outlet
  - platform: output
    name: Socket 3
    output: socket3_out
    id: socket3
    restore_mode: RESTORE_DEFAULT_ON
    device_class: outlet
  - platform: output
    name: Socket 4
    output: socket4_out
    id: socket4
    restore_mode: RESTORE_DEFAULT_ON
    device_class: outlet
  - platform: output
    name: USB
    output: usb_out
    id: usb
    icon: "mdi:usb-port"
    restore_mode: RESTORE_DEFAULT_ON

light:
  - platform: status_led
    id: main_status_led
    restore_mode: ALWAYS_ON
    pin:
      number: P11
      inverted: true
    effects:
      - strobe:
          name: Main button hold
          colors:
            - state: true
              duration: 150ms
            - state: false
              duration: 150ms

# Waking from deep sleep needs a long press on the button; short clicks are
# ignored by the BK7231N. Keeping P10's pull-up on during sleep (custom
# lambda instead of this component) was tried and didn't change that.
deep_sleep:
  id: deep_sleep_ctrl
  wakeup_pin:
    number: P10
    allow_other_uses: true
    inverted: true
    mode:
      input: true
      pullup: true
  wakeup_pin_mode: KEEP_AWAKE

script:
  - id: power_off
    then:
      - script.stop: hold_feedback
      - light.turn_off: main_status_led
      - output.turn_off: socket1_out
      - output.turn_off: socket2_out
      - output.turn_off: socket3_out
      - output.turn_off: socket4_out
      - output.turn_off: usb_out
      - deep_sleep.enter: deep_sleep_ctrl
  - id: hold_feedback
    mode: restart
    then:
      - delay: 5s
      - light.turn_on:
          id: main_status_led
          effect: Main button hold

binary_sensor:
  - platform: gpio
    id: main_button
    pin:
      number: P10
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: true
    internal: true
    on_press:
      - script.execute: hold_feedback
    on_release:
      - script.stop: hold_feedback
      - light.turn_on:
          id: main_status_led
          effect: None
    on_click:
      - min_length: 50ms
        max_length: 1s
        then:
          - script.execute: power_off
      - min_length: 6s
        max_length: 60s
        then:
          - button.press: factory_reset_btn

button:
  - platform: template
    name: Turn off
    icon: "mdi:power"
    on_press:
      - script.execute: power_off
  - platform: factory_reset
    id: factory_reset_btn
    internal: true

# The pins were checked with a multimeter and the datasheet for the built in BL0937.
sensor:
  - platform: uptime
    name: Uptime
  - platform: internal_temperature
    name: "Internal Temperature"
