# Board: Generic - BK7231N (Tuya QFN32)
# Definition: definitions/boards/generic-bk7231n-qfn32-tuya/manifest.yaml

esphome:
  name: smart-plug-zld-44eufr-w-yt
  friendly_name: smart plug ZLD-44EU(FR)-W-YT

bk72xx:
  board: generic-bk7231n-qfn32-tuya

logger:

api:
  encryption:
    key: !secret smart_plug_zld_44eufr_w_yt__encryption_key
ota:
  - platform: esphome
    password: !secret smart_plug_zld_44eufr_w_yt__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: smart-plug-44
    password: !secret smart_plug_zld_44eufr_w_yt__ap_password
captive_portal:

substitutions:
  bl0937_voltage_divider: "750"
  bl0937_current_resistor: "0.0025 ohm"

switch:
  - platform: gpio
    name: Socket 1
    pin: P6
    id: socket1
    icon: "mdi:power-socket-eu"
    restore_mode: RESTORE_DEFAULT_ON
    device_class: outlet
  - platform: gpio
    name: Socket 2
    pin: P7
    id: socket2
    icon: "mdi:power-socket-eu"
    restore_mode: RESTORE_DEFAULT_ON
    device_class: outlet
  - platform: gpio
    name: Socket 3
    pin: P24
    id: socket3
    icon: "mdi:power-socket-eu"
    restore_mode: RESTORE_DEFAULT_ON
    device_class: outlet
  - platform: gpio
    name: Socket 4
    pin: P8
    id: socket4
    icon: "mdi:power-socket-eu"
    restore_mode: RESTORE_DEFAULT_ON
    device_class: outlet
  - platform: gpio
    name: USB
    pin: P26
    id: usb
    icon: "mdi:usb-port"
    inverted: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: shutdown
    internal: false
    id: shutdown0

light:
  - platform: status_led
    id: main_status_led
    pin:
      number: P11

binary_sensor:
  - platform: gpio
    pin:
      number: P10
      mode:
        input: true
        pullup: true
    name: Power On
    device_class: power
    icon: "mdi:power"
    on_press:
      - then:
          - switch.turn_on: shutdown0

output:
  #- id: light_output_main
  #  platform: gpio
  #  pin: P11

# The pins were checked with a multimeter and the datasheet for the built in BL0937.
sensor:
  - platform: uptime
    name: Uptime
  - platform: internal_temperature
    name: "Internal Temperature"
#  - platform: hlw8012
#    model: BL0937
#    cf_pin:
#      number: P26 # temp
#      inverted: true
#    cf1_pin:
#      number: P6
#      inverted: true
#    sel_pin:
#      number: P21 #P24
#      inverted: true
#    current:
#      name: BL0937 Current
#    voltage:
#      name: BL0937 Voltage
#    power:
#      name: BL0937 Power
#    energy:
#      name: BL0937 Energy
#    voltage_divider: $bl0937_voltage_divider
#    current_resistor: $bl0937_current_resistor
    update_interval: 10s