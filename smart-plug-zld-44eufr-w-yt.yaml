# Board: Generic - BK7231N (Tuya QFN32)
# Definition: definitions/boards/generic-bk7231n-qfn32-tuya/manifest.yaml

esphome:
  name: smart-plug-zld-44eufr-w-yt
  friendly_name: smart plug ZLD-44EU(FR)-W-YT

bk72xx:
  board: generic-bk7231n-qfn32-tuya
  family: BK7231N

logger:

api:
  encryption:
    key: "JNXLn7ILh6wwnTVqQZFaym8RwlzpWVqkjj1343cIiCw="

ota:
  - platform: esphome
    password: !secret smart_plug_zld_44eufr_w_yt__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: smart plug Hotspot
    password: VVbhfr6FskRi
captive_portal:

substitutions:
  bl0937_voltage_divider: "750"
  bl0937_current_resistor: "0.0025 ohm"

# p9 - unknown
switch:
  - platform: gpio
    name: Socket 1
    pin: P6
    id: socket1
    icon: "mdi:power-socket-eu"
    restore_mode: ALWAYS_ON
  - platform: gpio
    name: Socket 2
    pin: P7
    id: socket2
    icon: "mdi:power-socket-eu"
  - platform: gpio
    name: Socket 3
    pin: P24
    id: socket3
    icon: "mdi:power-socket-eu"
  - platform: gpio
    name: Socket 4
    pin: P8
    id: socket4
    icon: "mdi:power-socket-eu"
  - platform: gpio
    name: USB
    pin: P26
    id: usb
    icon: "mdi:usb-port"
    inverted: true

# The LED is directly controlled via the state of the relay with the switch above
light:
  - platform: binary
    name: Main LED
    id: led_main
    output: light_output_main
    internal: true
  #- platform: binary
  #  name: Socket 4 LED
  #  id: led4
  #  output: light_output4
  #  internal: true

binary_sensor:
  - platform: gpio
    pin:
      number: P10
      mode:
        input: true
        pullup: false
    name: Power On
    device_class: power
    icon: "mdi:power"

output:
  - id: light_output_main
    platform: gpio
    inverted: true
    pin: P14
  #- id: light_output4
  #  platform: gpio
  #  inverted: true
  #  pin: P8

